version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dentacollab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentacollab}
      POSTGRES_DB: ${POSTGRES_DB:-dentacollab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentacollab} -d ${POSTGRES_DB:-dentacollab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dentacollab}:${POSTGRES_PASSWORD:-dentacollab}@postgres:5432/${POSTGRES_DB:-dentacollab}?schema=public
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - web_dist:/usr/share/nginx/html/web:ro
      - admin_dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - api

volumes:
  postgres_data:
  web_dist:
  admin_dist:
