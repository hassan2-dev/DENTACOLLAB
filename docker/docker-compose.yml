services:
  postgres:
    image: postgres:16-alpine
    container_name: dentacollab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dentacollab
      POSTGRES_PASSWORD: dentacollab
      POSTGRES_DB: dentacollab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentacollab -d dentacollab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
