# Nixpacks — DentaCollab API (Coolify)
# Base Directory: / (repo root)

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm", "openssl"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @dentacollab/api exec prisma generate",
  "pnpm --filter @dentacollab/api build",
  "test -f apps/api/dist/main.js"
]

[start]
cmd = "cd apps/api && npx prisma migrate deploy && node dist/main.js"

[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"
PORT = "3000"
