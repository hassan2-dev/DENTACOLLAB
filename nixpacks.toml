# Avoid Nixpacks + broken corepack on Coolify.
# Prefer Build Pack = Dockerfile (see ./Dockerfile).
# If you must use Nixpacks, leave Install empty and use npm (not corepack).

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]
aptPkgs = ["openssl"]

[phases.install]
cmds = [
  "npm install -g pnpm@9.15.9",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @dentacollab/api exec prisma generate",
  "pnpm --filter @dentacollab/api build",
  "test -f apps/api/dist/main.js"
]

[start]
cmd = "cd apps/api && npx prisma migrate deploy && node dist/main.js"

[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"
PORT = "3000"
# Prevent Nixpacks from injecting corepack from packageManager field
NIXPACKS_NO_CACHE = "1"
