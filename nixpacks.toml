# Nixpacks — DentaCollab API (Coolify / Railway)
# Base Directory must be repo root: /  (empty)

[phases.setup]
nixPkgs = ["openssl"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.15.9 --activate",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @dentacollab/api exec prisma generate",
  "pnpm --filter @dentacollab/api build",
  "test -f apps/api/dist/main.js"
]

# Coolify often overrides this — set the same Start Command in the UI
[start]
cmd = "cd apps/api && npx prisma migrate deploy && node dist/main.js"

[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"
PORT = "3000"
